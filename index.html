<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện sách</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f5f5f5;
    }

    header{
      background:#0066ff;
      color:white;
      padding:20px;
      text-align:center;
    }

    .container{
      padding:30px;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px;
    }

    .book{
      background:white;
      width:280px;
      padding:20px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      text-align:center;
    }

    .book h2{
      color:#333;
    }

    .book p{
      color:#666;
    }

    .btn{
      display:inline-block;
      background:#0066ff;
      color:white;
      padding:10px 20px;
      border-radius:6px;
      text-decoration:none;
      margin-top:10px;
    }

    footer{
      text-align:center;
      padding:20px;
      color:#666;
    }
  </style>
</head>
<body>

<header>
  <h1>📚 Thư viện sách</h1>
  <p>Website đọc sách miễn phí</p>
</header>

<div class="container">

  <div class="book">
    <h2>Sách 1</h2>
    <p>Giới thiệu sách PDF</p>
    <a class="btn" href="#">Đọc sách</a>
  </div>

  <div class="book">
    <h2>Sách 2</h2>
    <p>Tài liệu miễn phí</p>
    <a class="btn" href="#">Xem ngay</a>
  </div>

</div>
